<title>Tic Tac Toe</title>
<meta charset="UTF-8" />

<style>
  body,
  td,
  input {
    font-size: 24px;
    line-height: 1.5;
    text-align: center;
    font-family: system-ui, sans-serif;
  }
  td {
    height: 3rem;
    width: 3rem;
    text-align: center;
  }
  table {
    margin: 5rem auto;
  }
  @media (prefers-color-scheme: dark) {
    body,
    input {
      background: #222;
      color: #ccc;
    }
  }
  .login-container {
    text-align: center;
    margin: 5rem auto;
    max-width: 400px;
  }
  .login-container input[type="text"] {
    padding: 0.5rem;
    margin: 1rem;
    width: 250px;
  }
  .login-container button,
  .logout-button {
    padding: 0.5rem 1rem;
    font-size: 18px;
    cursor: pointer;
    background: #0969da;
    color: white;
    border: none;
    border-radius: 6px;
  }
  .login-container button:hover,
  .logout-button:hover {
    background: #0860ca;
  }
  .hidden {
    display: none;
  }
  .user-info {
    text-align: center;
    margin: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    .login-container button,
    .logout-button {
      background: #1f6feb;
    }
    .login-container button:hover,
    .logout-button:hover {
      background: #388bfd;
    }
  }
</style>

<div id="loginContainer" class="login-container">
  <h1>Tic Tac Toe</h1>
  <p>Please login to play</p>
  <input type="text" id="usernameInput" placeholder="Enter your username" />
  <br />
  <button id="loginButton">Login</button>
</div>

<div id="gameContainer" class="hidden">
  <h1>Tic Tac Toe</h1>
  <div class="user-info">
    <span>Welcome, <strong id="displayUsername"></strong>!</span>
    <button class="logout-button" id="logoutButton">Logout</button>
  </div>

<table>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
</table>

<h2 hidden>Game over</h2>
</div>

<script>
  // Login/Logout functionality
  const loginContainer = document.getElementById("loginContainer");
  const gameContainer = document.getElementById("gameContainer");
  const usernameInput = document.getElementById("usernameInput");
  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");
  const displayUsername = document.getElementById("displayUsername");

  // Check if user is already logged in
  function checkLoginStatus() {
    const username = sessionStorage.getItem("username");
    if (username) {
      showGame(username);
    }
  }

  // Show game and hide login
  function showGame(username) {
    displayUsername.textContent = username;
    loginContainer.classList.add("hidden");
    gameContainer.classList.remove("hidden");
  }

  // Show login and hide game
  function showLogin() {
    loginContainer.classList.remove("hidden");
    gameContainer.classList.add("hidden");
    usernameInput.value = "";
  }

  // Handle login
  loginButton.addEventListener("click", function() {
    const username = usernameInput.value.trim();
    if (username) {
      sessionStorage.setItem("username", username);
      showGame(username);
    } else {
      alert("Please enter a username");
    }
  });

  // Handle Enter key in username input
  usernameInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      loginButton.click();
    }
  });

  // Handle logout
  logoutButton.addEventListener("click", function() {
    sessionStorage.removeItem("username");
    showLogin();
    // Reset game
    location.reload();
  });

  // Check login status on page load
  checkLoginStatus();

  // Initialization
  const boxes = Array.from(document.querySelectorAll("td"));
  const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));
  const rows = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`tr:nth-child(${n}) td`))
  );
  const columns = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`td:nth-child(${n})`))
  );
  const diagonals = [
    [
      [1, 1],
      [2, 2],
      [3, 3],
    ],
    [
      [3, 1],
      [2, 2],
      [1, 3],
    ],
  ].map((set) =>
    set.map(([x, y]) =>
      document.querySelector(`tr:nth-child(${x}) td:nth-child(${y})`)
    )
  );
  const gameOver = document.querySelector("h2");
  const HUMAN = "🧑‍💻";
  const ROBOT = "🤖";

  // Decide who goes first
  if (Math.random() > 0.5) {
    runRobotTurn();
  }

  // Handle when a user clicks an input
  for (const input of inputs) {
    input.addEventListener("click", handleClickInput);
  }

  // The user chose a box, check for win, robot turn, check for win
  function handleClickInput(evt) {
    evt.target.closest("td").innerHTML = HUMAN;
    if (hasWin()) {
      return endGame();
    }
    runRobotTurn();
    if (hasWin()) {
      return endGame();
    }
  }

  // Choose a random available box
  function runRobotTurn() {
    const robotBoxes = shuffle(boxes);
    while (robotBoxes.length) {
      const box = robotBoxes.shift();
      if (box.querySelector("input")) {
        box.innerHTML = ROBOT;
        break;
      }
    }
  }

  // Determine win
  function hasWin() {
    return (
      rows.some(hasAllSame) ||
      columns.some(hasAllSame) ||
      diagonals.some(hasAllSame)
    );
  }

  // Determine if every cell matches
  function hasAllSame(arr) {
    return arr.every(
      (td) => !td.querySelector("input") && td.innerHTML === arr[0].innerHTML
    );
  }

  // Display game over, cancel events
  function endGame() {
    gameOver.hidden = false;
    for (const input of inputs) {
      input.removeEventListener("click", handleClickInput);
      input.remove();
    }
  }

  // Shuffle a copy of the input array
  function shuffle(array) {
    array = array.slice(0);
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * i);
      const temp = array[i];
      array[i] = array[j];
      array[j] = temp;
    }
    return array;
  }
</script>
